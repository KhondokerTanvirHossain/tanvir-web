# Static site behind Caddy (which terminates TLS and compresses).
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;
    gzip off;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # /resume is a stable link to the PDF; the old file name (already in inboxes) moves there for good.
    location = /resume { return 302 /resume.pdf; }
    location = /Tanvir_Hossain_Senior_Software_Engineer.pdf { return 301 /resume.pdf; }

    # CSS and JS are not fingerprinted, so they revalidate (ETag) and can never run stale against new HTML.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Long-ish cache for static files; add_header in a location replaces the server ones, so repeat them.
    location ~* \.(png|jpe?g|webp|avif|svg|ico|woff2?|pdf|mp4|webm)$ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Pages: clean URLs (/work/better-health serves better-health.html), never cached stale.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri.html $uri/index.html =404;
    }
}
