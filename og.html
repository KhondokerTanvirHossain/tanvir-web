<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>og</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Source+Sans+3:wght@600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; margin: 0; }
    body { display: grid; grid-template-columns: 1fr 380px; align-items: center; padding: 72px 80px; gap: 48px; }
    .eyebrow { font-size: 18px; margin-bottom: 28px; }
    h1 { font-size: 64px; line-height: 1.05; }
    .name { font: 600 22px var(--body); color: var(--mute); margin-top: 32px; display: block; }
    .photo { max-width: none; width: 380px; aspect-ratio: 4/5; border-radius: 12px; }
    .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: var(--accent); }
  </style>
</head>
<body>
  <div>
    <p class="eyebrow">Senior Software Engineer · Dhaka · Open to remote US roles</p>
    <h1>I build the systems that banks, regulators and hospitals <em>bet on</em>.</h1>
    <span class="name">Tanvir Hossain · tanvir.eliooo.org</span>
  </div>
  <div class="photo"><img src="assets/tanvir.jpg" alt=""></div>
  <div class="rule"></div>
</body>
</html>
