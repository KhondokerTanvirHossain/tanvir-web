<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>og</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; margin: 0; background: var(--stage); }
    body { display: grid; grid-template-columns: 1fr 470px; }
    .copy { display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 0 64px 0 72px; background: #0c0c0d; }
    .pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px; border-radius: 999px; background: #000; box-shadow: 0 0 0 1px rgba(255,255,255,.1); font: 500 18px/1 var(--font-text); color: var(--ink); }
    .pill::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #30d158; }
    h1 { font: 600 66px/1.03 var(--font-display); letter-spacing: -0.04em; color: var(--ink); max-width: 12ch; }
    .name { font: 500 22px/1.3 var(--font-text); color: var(--ink-2); }
    .photo { position: relative; overflow: hidden; background: #8a8a8a; }
    .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 58% 16%; filter: grayscale(1); }
  </style>
</head>
<body>
  <div class="copy">
    <span class="pill">Engineering Lead · Dhaka · Open to remote</span>
    <h1>I lead the team. And ship the whole product.</h1>
    <span class="name">Tanvir Hossain · tanvir.eliooo.org</span>
  </div>
  <div class="photo"><img src="assets/portrait-1086.jpg" alt=""></div>
</body>
</html>
